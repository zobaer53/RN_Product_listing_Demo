appId: com.zobaer53.productexplorer
name: E2E-11 deep link opens product details
tags:
  - smoke
---
# Cold start from the link (the app is closed), the way users open shared links.
- stopApp
- clearState
- openLink: 'productexplorer://products/5'
- extendedWaitUntil:
    visible:
      id: 'details-title'
    timeout: 20000
- assertVisible:
    id: 'product-details'
- assertVisible:
    id: 'details-price'
