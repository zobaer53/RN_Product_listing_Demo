name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APK_NAME: product-explorer-debug-${{ github.sha }}.apk

jobs:
  verify:
    name: Lint, format, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:cov

  android-debug:
    name: Build standalone debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore shared debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "Using the shared debug keystore."
          else
            echo "No shared keystore configured; using the default debug keystore."
          fi

      - name: Assemble debug APK
        working-directory: android
        env:
          # Bundle the JS into the APK so it runs without Metro.
          EMBED_JS_BUNDLE: '1'
          # Empty when the secrets are not set; the build then falls back to the defaults.
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Assert backups are disabled in the merged manifest
        run: |
          MANIFEST="$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' -path '*debug*' | head -n 1)"
          test -n "$MANIFEST" || { echo "Merged manifest not found"; exit 1; }
          grep -q 'android:allowBackup="false"' "$MANIFEST" || { echo "allowBackup is not false in $MANIFEST"; exit 1; }

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30

  e2e-android-smoke:
    name: Maestro smoke on Android emulator
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Smoke flows use the real API. Mock-based flows would also need the mock server
          # started and `adb reverse tcp:4010 tcp:4010` before running Maestro.
          script: |
            adb install -r "$APK_NAME"
            maestro test --include-tags smoke --format junit --output maestro-report.xml .maestro/flows

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-report
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14
