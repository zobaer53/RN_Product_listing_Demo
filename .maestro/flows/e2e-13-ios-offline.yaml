# The iOS simulator cannot toggle airplane mode, so this approximates "offline" by making
# the mock API drop every connection.
appId: com.zobaer53.productexplorer
name: E2E-13 unreachable server on iOS shows an error state
tags:
  - offline
  - ios
  - mock
onFlowStart:
  - runFlow:
      file: ../subflows/set-scenario.yaml
      env:
        SCENARIO: network-down
onFlowComplete:
  - runFlow:
      file: ../subflows/set-scenario.yaml
      env:
        SCENARIO: ok
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'state-error|state-offline'
    timeout: 45000
- assertVisible:
    id: 'state-error-retry|state-offline-retry'
- runFlow:
    file: ../subflows/set-scenario.yaml
    env:
      SCENARIO: ok
- tapOn:
    id: 'state-error-retry|state-offline-retry'
- extendedWaitUntil:
    visible:
      id: 'product-card-1'
    timeout: 20000
